services:
  postgres:
    image: postgres:16-alpine
    container_name: psprelay-postgres
    environment:
      POSTGRES_USER: psprelay
      POSTGRES_PASSWORD: psprelay_password
      POSTGRES_DB: psprelay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psprelay -d psprelay"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kafka:
    profiles:
      - kafka
    image: apache/kafka:3.8.0
    container_name: psprelay-kafka
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  psprelay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psprelay
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    ports:
      - "8083:8083"
    environment:
      - ADDR=:8083
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - CONFIG_FILE_PATH=/app/config.yaml
      - DATABASE_URL=postgres://psprelay:psprelay_password@postgres:5432/psprelay?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=psp.webhooks
      - KAFKA_DLQ_TOPIC=psp.webhooks.dlq
      - KAFKA_CONSUMER_GROUP=psprelay-dispatcher
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8083/v1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
