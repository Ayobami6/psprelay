name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race-enabled tests with coverage
        run: |
          go test -race -v -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total test coverage: ${total}% (threshold: 90.0%)"
          awk -v total="$total" 'BEGIN { if (total + 0 < 90.0) { printf "FAIL: coverage %.1f%% is below 90.0%%\n", total; exit 1 } else { printf "PASS: coverage %.1f%% meets 90.0%% threshold\n", total } }'

      - name: Write coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo "### 🧪 Go Test Coverage Summary"
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  build:
    name: Build Cross-Platform Binaries & Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static binaries across targets
        run: |
          mkdir -p dist
          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )
          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            out="dist/psprelay-${GOOS}-${GOARCH}${ext}"
            echo "Building ${out}..."
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/main.go
          done
          ls -lh dist/

      - name: Upload built binaries
        uses: actions/upload-artifact@v7
        with:
          name: psprelay-binaries
          path: dist/
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: psprelay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container binary execution
        run: |
          docker run -d --name psprelay-ci -p 8083:8083 psprelay:ci
          trap "docker rm -f psprelay-ci" EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8083/v1/healthz; then
              echo ""
              echo "Container healthcheck succeeded"
              exit 0
            fi
            sleep 1
          done
          docker logs psprelay-ci
          exit 1

  security:
    name: Vulnerability Check (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
